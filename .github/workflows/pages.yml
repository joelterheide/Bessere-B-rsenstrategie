name: Website

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # alle 30 Minuten neuer Fear & Greed Index (CNN aktualisiert während der US-Handelszeit laufend)
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Fear & Greed holen
        run: python3 tools/sentiment.py sentiment.json

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html css js demo PROMPT.md sentiment.json _site/

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
